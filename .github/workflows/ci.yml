name: CI

# Builds a debug APK (engine for arm64-v8a and x86_64) in the same image as
# the releases (core/scripts/android-builder.Dockerfile). Public repository:
# GitHub Actions minutes are free.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kotlin compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile (no native engine; the runner ships the Android SDK)
        run: ./gradlew --no-daemon -q compileDebugKotlin
